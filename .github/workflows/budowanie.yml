name: Kontrola budowania

# Serwis stoi na Cloudflare Pages pod domeną skilful.pl. Cloudflare buduje go
# sam po każdym wypchnięciu na main, więc GitHub Actions niczego nie publikuje
# — sprawdza tylko, czy projekt w ogóle się buduje.
#
# Po co, skoro Cloudflare i tak zbuduje: błąd widać tutaj od razu przy pull
# requeście, zanim trafi na gałąź główną i zanim Cloudflare zdąży wypuścić
# zepsutą wersję na domenę.
#
# Poprzednia wersja tego pliku publikowała serwis na GitHub Pages pod adresem
# z podkatalogiem /SAver.1. Po przejściu na własną domenę `base` w
# astro.config.mjs wynosi '/', więc taka publikacja dawałaby stronę bez stylów
# i bez fontów. Wdrożenie na Pages zostało z tego powodu usunięte.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budowanie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budowanie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalacja zależności
        run: npm ci
        working-directory: web

      - name: Budowanie serwisu
        run: npm run build
        working-directory: web
